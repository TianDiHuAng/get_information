# AIDD（AI 制药）行业包
#
# 这个包覆盖 config/ 下的同名文件。切换：
#   RADAR_PACK=aidd RADAR_DB=data/aidd.db RADAR_SITE=site-aidd python run.py
#
# 分类 key 会进网址，上线后不要改。

categories:
  platform_release: {label: 平台发布, desc: 新的 AIDD 平台、模型、引擎正式发布或大版本更新}
  pipeline_progress: {label: 管线进展, desc: 候选分子进入临床前/临床、里程碑达成、项目终止}
  clinical_data: {label: 临床数据, desc: 临床试验读出、疗效与安全性数据、终点达成}
  research_paper: {label: 论文研究, desc: 论文、预印本、数据集、基准结果}
  tool_or_method: {label: 工具方法, desc: 可直接复用的开源工具、流程、prompt、建模方法}
  industry_event: {label: 融资合作, desc: 融资、并购、BD 授权、合作、人事}
  regulatory: {label: 监管审批, desc: 获批、受理、指导原则、监管政策}
  dataset_benchmark: {label: 数据与评测, desc: 公开数据集、benchmark、评测榜单}

