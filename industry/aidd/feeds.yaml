  - {id: gn_med_llm, name: "医疗 AI 大模型（Google 新闻）", url: "https://news.google.com/rss/search?q=%E5%8C%BB%E7%96%97%20AI%20%E5%A4%A7%E6%A8%A1%E5%9E%8B&hl=zh-CN&gl=CN&ceid=CN:zh-Hans", region: domestic, layer: search, limit: 12, proxy: true}

