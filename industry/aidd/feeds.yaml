  - {id: pubmed_aidd_design, name: "生成式分子/蛋白设计（PubMed）", url: "%28generative%5BTitle%2FAbstract%5D%29%20AND%20%28molecule%5BTitle%2FAbstract%5D%20OR%20protein%20design%5BTitle%2FAbstract%5D%29", region: overseas, layer: primary, limit: 12, proxy: false}
