feeds:
  # —— 生物医药媒体 ——
  - {id: endpoints, name: "Endpoints News", url: "https://endpts.com/feed/", region: overseas, layer: primary, limit: 12, proxy: true}
  - {id: stat, name: "STAT", url: "https://www.statnews.com/feed/", region: overseas, layer: primary, limit: 12, proxy: true}
  - {id: gen, name: "GEN", url: "https://www.genengnews.com/feed/", region: overseas, layer: primary, limit: 12, proxy: true}
  - {id: biopharmadive, name: "BioPharma Dive", url: "https://www.biopharmadive.com/feeds/news/", region: overseas, layer: broad, limit: 10, proxy: true}
  - {id: labiotech, name: "Labiotech", url: "https://www.labiotech.eu/feed/", region: overseas, layer: broad, limit: 10, proxy: true}
  # —— 期刊 ——
  - {id: nature_biotech, name: "Nature Biotechnology", url: "https://www.nature.com/nbt.rss", region: overseas, layer: primary, limit: 10, proxy: true}
  - {id: nature_drugdisc, name: "Nature Reviews Drug Discovery", url: "https://www.nature.com/nrd.rss", region: overseas, layer: primary, limit: 10, proxy: true}
