  - {id: gn_tencent_med2, name: "腾讯 智慧医疗（Google 新闻）", url: "https://news.google.com/rss/search?q=%E8%85%BE%E8%AE%AF%20%E6%99%BA%E6%85%A7%E5%8C%BB%E7%96%97&hl=zh-CN&gl=CN&ceid=CN:zh-Hans", region: domestic, layer: search, limit: 12, proxy: true}
