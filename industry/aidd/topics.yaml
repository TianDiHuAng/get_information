# AIDD 关注主题 —— 这一份替换 config/topics.yaml 的同名字段。
#
# 为什么需要它：全局词表是「科技/AI」的（AI、大模型、智能体…），
# 拿它去筛制药新闻，等于用错的尺子量东西 —— 国内的制药报道很少自称 AI，
# 结果大量真新闻在准入门槛就被挡掉（11-12 那天 61 条里 41 条被拦）。
#
# keywords: 命中即打标签并加权（偏 AI × 制药 交叉）
# domestic_keywords: 国内源准入词表，命中其一才收录（抗社会新闻/八卦）
# deal_keywords: 交易/融资类，单独可用于羊毛与商业版块

