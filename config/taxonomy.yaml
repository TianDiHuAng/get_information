  openai:      {name: OpenAI,         aliases: [GPT, ChatGPT]}
  google:      {name: Google,         aliases: [谷歌, DeepMind, 深度思维, Gemini, TPU]}
  meta:        {name: Meta,           aliases: [脸书, Facebook, Llama]}
