  zhipu:       {name: 智谱,           aliases: [智谱AI, GLM, Z.ai]}
  minimax:     {name: MiniMax,        aliases: [稀宇]}
  stepfun:     {name: 阶跃星辰,        aliases: [StepFun, 阶跃]}
