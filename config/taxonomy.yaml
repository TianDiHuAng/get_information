  amazon:      {name: Amazon,         aliases: [亚马逊, AWS, Bedrock]}
  apple:       {name: Apple,          aliases: [苹果]}
  xai:         {name: xAI,            aliases: [Grok, 马斯克, Musk]}
  mistral:     {name: Mistral,        aliases: []}
  huggingface: {name: Hugging Face,   aliases: [HF]}
  deepseek:    {name: DeepSeek,       aliases: [深度求索]}
