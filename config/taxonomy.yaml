# grounding 的豁免词：通用技术词、站内常用词。它们不构成"张冠李戴"的证据。
# 注意：**不要**把实体名（OpenAI / Anthropic…）写进这里 —— 它们正是要被检查的对象。
plain_terms:
  [AI, AGI, API, SDK, LLM, LLMs, GPU, CPU, TPU, NPU, RAG, MCP, CLI, JSON, HTTP, URL,
   Token, token, tokens, Prompt, prompt, Agent, agent, Benchmark, benchmark,
   模型, 大模型, 开源, 论文, 榜单, 发布会, 融资, 估值, 智能体, 多模态, 推理, 训练,
   微调, 算力, 芯片, 机器人, 具身智能, 上下文, 价格, 免费, 开放, 上线, 评测,
   arXiv, GitHub, AIHOT, Get_Information]
