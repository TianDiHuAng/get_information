# 行业词表：分类、标签、实体（公司/产品）
#
# 三个用途：
# 1. `structure.md` 提示词用它约束模型的输出（分类只能是这 8 个，标签只能从词表里挑）；
# 2. 主题页/标签页按它聚合；
# 3. `grounding` 用它判断"模型写的名字是不是原文没提过的"（防张冠李戴）。
#
# 上线后改 key 会让历史数据对不上，所以 key 定下就别动，改 label 和描述没关系。

categories:
  model_release:      {label: 模型发布, desc: 新模型或大版本更新、价格与可用性变化}
  product_launch:     {label: 产品上线, desc: 新产品、工具或重大功能上线}
  tool_or_prompt:     {label: 工具与方法, desc: 可直接复用的方法、Prompt、Skill、工作流}
  research_paper:     {label: 论文研究, desc: 论文、技术报告、实验结果}
  industry_event:     {label: 行业动态, desc: 融资、收购、监管、诉讼、人事、合作}
  opinion_analysis:   {label: 观点解读, desc: 观点、行业判断、复盘、访谈}
  tutorial_explainer: {label: 教程评测, desc: 教程、科普、上手体验、评测}
  deal:               {label: 羊毛福利, desc: 免费额度、限免、优惠、赠金、开放权重}

# 标签词表（模型只能从这里挑；没合适的就不打）
