# 阅读反馈 → 排序微调
#
# 这里是单用户，所以"你点过什么"就是最强的信号。但只用它在同分时微调排序，
# 不参与入选门槛 —— 门槛是"值不值得看"的公共标准，掺进偏好会让日报越来越窄。

enabled: true

# 每种动作给多少权重（正数 = 更想看，负数 = 更不想看）
kinds:
  up: 1.0      # 页面上点"有用"
  down: -1.2   # 点"没用"：比不点更强，因为它是明确的否定
  open: 0.25   # 点开原文：弱信号，可能只是好奇

# 排序最多被拉动多少（0.08 = ±8%）。它不是重写排序，只是让同分条目换个先后。
scale: 0.08

# 回头看多少天的反馈
days: 60

# 一个词至少要有几次证据才参与加权（避免点了一次就改口味）
min_evidence: 3

# 最多保留多少个词（按权重绝对值取前 N）
max_terms: 300
