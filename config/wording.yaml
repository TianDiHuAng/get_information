# 改用词：标题 / 摘要 / 推荐理由里出现这些词，让模型只把词换掉（不重写）。
#
# 为什么需要：每个行业都有一批"读者不这么说"的词 —— 夸张的营销词、看不懂的行话、
# 方言。改词比改提示词便宜，也不会动事实。
#
# 规则是正则 + 改法。**空着就一次都不调用**，不影响出刊。
# 四条安全边界（见 collector/wording.py）：改完数字变了 / 变空 / 模型失败 → 保留原文。
#
# 换行业时把这里换成你行业的词。

