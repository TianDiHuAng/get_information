# 正文提取：只给"够格"的条目补原文
#
# 为什么值得单独一层：评分与结构化现在只看 RSS 摘要（往往只有一两句），
# 质量天花板就卡在这里。AIHOT 对每条资料都抓原文再判，但那是按量付费的云端；
# 这里是本机抓取，成本是带宽和时间，所以按分数挑着抓。

enabled: true

# 只给排序分不低于它的条目补正文（0 = 不限）
min_score: 45

# 一轮最多抓几篇（0 = 不限）。60 篇大约 1–3 分钟，视站点快慢。
max_items: 60

max_workers: 4
timeout: 20

# 抓回来正文的最大长度（喂模型时会再截到 scoring.yaml 的 max_chars）
max_chars: 6000

# 正文短于这个字数就不算抓到：多半是拦截页、登录页、纯图页。
# 宁可没有正文，也不要喂一段导航给模型。
min_body_chars: 120

# 只在"缺摘要 或 缺发布日期"时才抓：
# 设 false 会给所有够格条目都补正文（评分更准，代价是一轮多几十次请求）
only_when_missing: false

# 这些域名不抓：要么是 JS 渲染（拿不到正文），要么需要登录
skip_hosts:
  - x.com
  - twitter.com
  - m.weibo.cn
  - weibo.com
  - zhihu.com
  - bilibili.com
  - t.me
  - news.google.com
  - arxiv.org
