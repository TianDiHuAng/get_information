# 当前行业。切换行业包就改 pack；留空表示直接用 config/ 下的文件。
name: Z-Bit
tagline: 今日 AI 热点与大模型动态精选
description: 每天一份 AI 情报日报：五轴评分、事件聚簇、规则编排
locale: zh-CN
pack: 
# 报头字：日报/周报/月报页顶部的品牌字。换行业后改这里，不用重新生成图片。
nameplate:
  daily: "AI日报"
  weekly: "AI周报"
  monthly: "AI月报"

edition:
  daily: 09:00
  weekly: 周一
  monthly: 1 日
tiers:
  T1: 46
  T1_5: 54
  T2: 56
browse_floor: 40

# 对外合并分类：网页上仍分开，但 RSS / API / llms.txt 里并成一组发布。
# 对齐 AIHOT 的 PUBLIC_CATEGORIES。key 是分类 key，value 是合并后的 key。
public_categories: {}
#  deal: model_release

# 隐藏导航入口但保留地址（直接打开仍能访问）。
# 对齐 AIHOT 的 NAV.hidden，只接受明确的几个路径。
nav_hidden: []

# 公开接口版本：只升不降。改了已有字段或含义才升主版本。
api_version: "1"

# MCP 工具名前缀：工具名 = <前缀>_get_latest 这种。上线后不要改（客户端会存工具名）。
mcp_prefix: zbit
